<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
     <header>
        <h1 style="text-align: center; background-color: burlywood">Inscrição em Eventos</h1>
        <hr>
    </header>
    <br>
    <main>
        <form action="#" method="POST">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome..." required>
            <br>
            <br>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Digite seu email..." required>
            <br>
            <br>

            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" name="telefone" placeholder="Digite seu telefone..." required>
            <br>
            <br>

            <label for="cargo">Cargo</label>
            <input type="text" id="cargo" name="cargo" placeholder="Digite seu cargo..." required>
            <br>
            <br>

            <label for="Empresa">Empresa</label>
            <input type="text" id="Empresa" name="Empresa" placeholder="Digite o nome da sua empresa..." required>
            <br>
            <br>

            <label for="data_evento">Data do Evento</label>
            <input type="date" id="data_evento" name="data_evento" required>
            <br>
            <br>

            <label for="horario_evento">Horário</label>
            <input type="time" id="horario_evento" name="horario_evento" required>
            <br>
            <br>

            <label for="alimentacao_preferida">Alimentação Preferida</label>
            <input type="text" id="alimentacao_preferida" name="alimentacao_preferida" placeholder="Digite sua alimentação preferida..." required>
            <br>
            <br>

            <label for="restricoes_alimentares">Restrições Alimentares</label>
            <input type="text" id="restricoes_alimentares" name="restricoes_alimentares" placeholder="Digite suas restrições alimentares..." required>
            <br>
            <br>

            <label for="necessidades_especiais">Necessidades Especiais</label>
            <input type="text" id="necessidades_especiais" name="necessidades_especiais" placeholder="Digite suas necessidades especiais..." required>
            <br>
            <br>

            <label for="aceitar_privacidade">Aceitar Política de Privacidade</label>
            <input type="checkbox" id="aceitar_privacidade" name="aceitar_privacidade" required>
            <br>

            <label for="notificacao">Deseja receber notificações?</label>
            <input type="checkbox" id="notificacao" name="notificacao">
            <br>
            <br>

            <label for="telefone_acompanhante">Telefone do Acompanhante</label>
            <input type="tel" id="telefone_acompanhante" name="telefone_acompanhante" placeholder="Digite o telefone do acompanhande...">
            <br>
            <br>

            

            <input type="submit" value="Inscrever-se">
        </form>
    </main>
</body>
</html>
