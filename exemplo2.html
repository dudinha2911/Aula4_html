<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Formulários - Exemplo2 </title>
</head>
<body>
    <header>
        <h1 style="text-align: center; background-color: burlywood; color: white;">Cadastro de Alunos</h1>
        <hr>
    </header>
    <br>
    <main>
        <!-- Formulário de Alunos -->
         <form action="#" method="GET">
            <!-- Nome do aluno -->
            <label for="nome">Nome do aluno</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome..." required>
            <br>
            <br>

            <!-- Email do aluno -->
            <label for="email">Email do aluno</label>
            <input type="email" id="email" name="email" placeholder="Digite seu email..." required>
            <br>
            <br>

            <!-- Telefone -->
            <label for="telefone">Telefone do aluno</label>
            <input type="tel" id="telefone" name="telefone" placeholder="Digite seu telefone..." required>
            <br>
            <br>

            <!-- Data de Nascimento -->
            <label for="data_nascimento">Data de Nascimento</label>
            <input type="date" id="data_nascimento" name="data_nascimento" required>
            <br>
            <br>

            <!-- Idade -->
            <label for="idade">Idade do aluno</label>
            <input type="number" id="idade" name="idade" placeholder="Digite sua idade..." required>
            <br>
            <br>

            <!-- Escolha(Sim) -->
            <label>Você estuda para as provas?</label>
            <br>
            <!-- Radio button só pode ser escolhido uma vez -->
            <label for="sim">Sim, estudo</label>
            <input type="radio" value="Sim" id="sim" name="pergunta">
            <br>

            <!-- Escolha(Não) -->
            <label for="nao">Não estudo</label>
            <input type="radio" value="Nao" id="nao" name="pergunta">
            <br>
            <br>

            <!-- Campo Range -->
            <label for="progresso">Quanto você gosta da aula do Senai?</label>
            <!-- Input do tipo range cria uma barra de progresso -->
            <input type="range" id="progresso" name="progresso">
            <br>
            <br>

            <!-- Cor favorita -->
            <label for="cor">Escolha sua cor favorita:</label>
            <input type="color" id="cor" name="cor">
            <br>
            <br>

            <!-- Seleção -->
            <label for="opacao">Selecione a sua sala:</label>
            <!-- Campo de Seleção -->
            <select name="opcao" id="opcao">
                <!-- Criando opções para selecionar -->
                <option value="" selected disabled>Selecione...</option>
                <option value="Sala Vermelha">Sala Vermelha</option>
                <option value="Sala Azul">Sala Azul</option>
                <option value="Sala Verde">Sala Verde</option>
            </select>
            <br>
            <br>

            <!-- Arquivos -->
            <label for="file">Envie sua foto:</label>
            <input type="file" id="file" name="file">
            <br>
            <br>

            <!-- Campo com Textarea -->
            <label for="obs">Observações:</label>
            <textarea name="obs" id="obs" rows="8" cols="50"></textarea>
            <br>
            <br>

            <!-- Campo com checkbox -->
            <input type="checkbox" id="termos" name="termos" value="termos">
            <label for="termos">Li e concordo com os termos</label>
            <br>
            <input type="checkbox" id="receberEmail" name="receberEmail" value="receberEmail">
            <label for="receberEmail">Desejo receber email de divulgação</label>
            <br>
            <input type="checkbox" name="receberSms" id="receberSms" value="receberSms">
            <label for="">Desejo receber SMS de divulgação</label>
            <br>
            <br>

            <!-- Botão de envio -->
            <button type="submit">Enviar</button>
         </form>
    </main>
</body>
</html>
