<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Inscrição em Cursos</title>
</head>
<body>
     <header>
        <h1 style="text-align: center; background-color: hotpink">Inscrição em Cursos</h1>
        <hr>
    </header>
    <br>
    <main>
        <form action="#" method="POST">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome..." required>
            <br>
            <br>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Digite seu email..." required>
            <br>
            <br>

            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" name="telefone" placeholder="Digite seu telefone..." required>
            <br>
            <br>

            <label for="endereco">Endereço</label>
            <input type="text" id="endereco" name="endereco" placeholder="Digite seu endereço..." required>
            <br>
            <br>

            <label for="data_nascimento">Data de Nascimento</label>
            <input type="date" id="data_nascimento" name="data_nascimento" required>
            <br>
            <br>

            <label>Gênero:</label>
            <br>
            <label for="feminino">Feminino♀️</label>
            <input type="radio" value="feminino" id="feminino" name="pergunta" required>
            <br>
            <label for="masculino">Masculino♂️</label>
            <input type="radio" value="masculino" id="masculino" name="pergunta" required>
            <br>
            <br>

            <label for="escolaridade">Escolaridade</label>
            <select id="escolaridade" name="escolaridade" required>
                <option value="">Selecione...</option>
                <option value="ensino_fundamental">Ensino Fundamental</option>
                <option value="ensino_medio">Ensino Médio</option>
                <option value="ensino_superior">Ensino Superior</option>
            </select>
            <br>
            <br>

            <label for="profissao">Profissão</label>
            <input type="text" id="profissao" name="profissao" placeholder="Digite sua profissão..." required>
            <br>
            <br>

            <label for="experiência_anterior">Experiência Anterior</label>
            <textarea id="experiência_anterior" name="experiência_anterior" placeholder="Descreva sua experiência anterior..." required></textarea>
            <br>
            <br>

            <label for="motivacao">Motivação para o Curso</label>
            <textarea id="motivacao" name="motivacao" placeholder="Descreva sua motivação para o curso..." required></textarea>
            <br>
            <br>

            <label for="expectativas">Expectativas para o Curso</label>
            <textarea id="expectativas" name="expectativas" placeholder="Descreva suas expectativas para o curso..." required></textarea>
            <br>
            <br>

            <label for="termos_condicoes">Li e concordo com os termos e condições</label>
            <input type="checkbox" id="termos_condicoes" name="termos_condicoes" required>
            <br>

            <label for="notificacao">Desejo receber notificações sobre o curso por e-mail</label>
            <input type="checkbox" id="notificacao" name="notificacao">
            <br>
            <br>

            <label for="nivel_conhecimento">Nível de Conhecimento em Informática</label>
            <select id="nivel_conhecimento" name="nivel_conhecimento" required>
                <option value="">Selecione...</option>
                <option value="iniciante">Iniciante</option>
                <option value="intermediario">Intermediário</option>
                <option value="avancado">Avançado</option>
            </select>
            <br>
            <br>

            <label for="disponibilidade_horario">Disponibilidade de Horário</label>
            <select id="disponibilidade_horario" name="disponibilidade_horario" required>
                <option value="">Selecione...</option>
                <option value="manha">Manhã</option>
                <option value="tarde">Tarde</option>
                <option value="noite">Noite</option>
            </select>
            <br>
            <br>

            <label for="referancia_amigos">Referência de Amigos</label>
            <input type="text" id="referancia_amigos" name="referancia_amigos" placeholder="Digite o nome de um amigo que o indicou...">
            <br>
            <br>

            <label for="hobbies">Hobbies</label>
            <input type="text" id="hobbies" name="hobbies" placeholder="Digite seus hobbies...">
            <br>
            <br>
            
            <label for="estado_civil">Estado Civil</label>
            <select id="estado_civil" name="estado_civil" required>
                <option value="">Selecione...</option>
                <option value="solteiro">Solteiro</option>
                <option value="casado">Casado</option>
                <option value="divorciado">Divorciado</option>
                <option value="viuvo">Viúvo</option>
            </select>
            <br>
            <br>

            <label for="idiomas">Idiomas que fala</label>
            <select id="idiomas" name="idiomas" required>
                <option value="">Selecione...</option>
                <option value="portugues">Português</option>
                <option value="ingles">Inglês</option>
                <option value="espanhol">Espanhol</option>
                <option value="frances">Francês</option>
            </select>
            <br>
            <br>

            <label for="pagamento">Método de Pagamento</label>
            <select id="pagamento" name="pagamento" required>
                <option value="">Selecione...</option>
                <option value="cartao_credito">Cartão de Crédito</option>
                <option value="boleto">Boleto Bancário</option>
                <option value="transferencia">Transferência Bancária</option>
            </select>
            <br>
            <br>

            <label for="outras_obs">Outras Observações</label>
            <textarea id="outras_obs" name="outras_obs" placeholder="Digite outras observações relevantes..."></textarea>
            <br>
            <br>

            <input type="submit" value="Inscrever-se">
        </form>
    </main>
</body>
</html>
